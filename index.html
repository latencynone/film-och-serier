<style>
*{box-sizing:border-box}
:root{
  --ink:#08080D; --panel:#17181F; --line:#42445C;
  --film:#FFD666; --serie:#7EF0F7; --fav:#FF7F9A; --sett:#7CFF9B; --want:#FFA94D;
  --rt:#FF6B4A; --mc:#8FD3FF; --mine:#C9A6FF;
  --txt:#FFFFFF; --dim:#C7C9DE; --dim2:#E9EAF7; --on-accent:var(--ink); --desc:#E7E8F5;
  --display:'Oswald','Arial Narrow',Impact,sans-serif;
  --body:'Inter',system-ui,-apple-system,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
  --radius:0; --shadow:none;
  color-scheme: dark;
}

/* ---- Modern: mörk, ren app-känsla, dova accentfärger, rundade ytor ---- */
[data-theme="modern"]{
  --ink:#000000; --panel:#161616; --line:#2C2C2E;
  --film:#8FB3FF; --serie:#5EEAD4; --fav:#FDA4AF; --sett:#6EE7B7; --want:#FBBF66;
  --rt:#FCA5A5; --mc:#7DD3FC; --mine:#C4B5FD; --gold:#F5C518;
  --txt:#F3F4F8; --dim:#9B9B9E; --dim2:#BDC4D6; --on-accent:var(--ink); --desc:#D7DAE5;
  --display:-apple-system,BlinkMacSystemFont,'SF Pro Display','Inter',system-ui,sans-serif;
  --body:-apple-system,BlinkMacSystemFont,'Inter',system-ui,sans-serif;
  --radius:10px; --shadow:0 8px 24px -14px rgba(0,0,0,.6);
  color-scheme: dark;
}

/* ---- Mjuk: ljus, varm, rundad designhus-känsla, djupare dova accenter ---- */
[data-theme="soft"]{
  --ink:#FFFFFF; --panel:#F5F5F7; --line:#D2D2D7;
  --film:#0071E3; --serie:#12707D; --fav:#FF375F; --sett:#34C759; --want:#A65200;
  --rt:#FF3B30; --mc:#155D91; --mine:#AF52DE;
  --txt:#1D1D1F; --dim:#6E6E73; --dim2:#48484A; --on-accent:#FFFFFF; --desc:#3A3A3C;
  --display:-apple-system,BlinkMacSystemFont,'SF Pro Display','Inter',system-ui,sans-serif;
  --body:-apple-system,BlinkMacSystemFont,'SF Pro Text','Inter',system-ui,sans-serif;
  --radius:18px; --shadow:0 2px 8px rgba(0,0,0,.06),0 14px 30px -18px rgba(0,0,0,.16);
  color-scheme: light;
}
html{background:var(--ink)}
html,body{margin:0;padding:0}
body{background:var(--ink);color:var(--txt);font-family:var(--body);
  min-height:100vh;padding-bottom:56px;-webkit-font-smoothing:antialiased;
  -webkit-text-size-adjust:100%}
.wrap{max-width:880px;margin:0 auto;padding:0 16px}

.bar{background:var(--film);color:var(--on-accent);padding:10px 16px;
  display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.bar h1{font-family:var(--display);font-weight:700;font-size:26px;
  letter-spacing:.06em;text-transform:none;margin:0;line-height:26px;cursor:pointer}
.hamburger{background:none;border:none;color:inherit;display:flex;flex-direction:column;
  justify-content:space-between;width:22px;height:16px;flex:0 0 22px;cursor:pointer;
  opacity:.85;padding:0;align-self:center}
.hamburger:hover{opacity:1}
.hb-bar{display:block;width:100%;height:2px;border-radius:1px;background:currentColor}
.bar-right{margin-left:auto}
.today{font-family:var(--mono);font-size:11px;letter-spacing:.1em}
.menu-pick-select{background:var(--ink);border:1px solid var(--line);color:var(--txt);
  font-family:var(--mono);font-size:12px;padding:7px 26px 7px 10px;border-radius:var(--radius);
  -webkit-appearance:none;appearance:none;cursor:pointer;
  background-image:linear-gradient(45deg,transparent 50%,var(--dim) 50%),linear-gradient(135deg,var(--dim) 50%,transparent 50%);
  background-position:calc(100% - 13px) 55%,calc(100% - 9px) 55%;background-size:4px 4px;background-repeat:no-repeat}

.menu-dropdown{display:none;position:absolute;top:56px;left:16px;z-index:20;
  background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:0 12px 28px -10px rgba(0,0,0,.5);overflow:hidden;min-width:220px}
.menu-dropdown.open{display:block}
.menu-dropdown button{display:block;width:100%;text-align:left;background:none;border:none;
  border-bottom:1px solid var(--line);color:var(--txt);font-family:var(--body);font-size:14px;
  padding:13px 16px;cursor:pointer}
.menu-dropdown button:last-child{border-bottom:none}
.menu-dropdown button:hover{background:var(--ink)}
.menu-row-toggle{display:flex;align-items:center;justify-content:space-between}
.menu-caret{color:var(--dim);font-family:var(--mono);font-size:16px;font-weight:700;
  line-height:1;transition:transform .15s}
.menu-row-toggle[aria-expanded="true"] .menu-caret{transform:rotate(180deg)}
.theme-options[hidden]{display:none}
.theme-option{background:var(--ink);font-size:13px!important;color:var(--dim)!important;
  padding:11px 16px 11px 30px!important;border-bottom:1px solid var(--line)!important}
.theme-option[aria-current="true"]{color:var(--txt)!important;font-weight:700;
  text-decoration:underline;text-underline-offset:3px}
.menu-dropdown #menuRemovedCount{color:var(--dim);font-family:var(--mono);font-size:11px}
.sub{font-family:var(--mono);font-size:clamp(8.5px,2.6vw,11px);color:var(--dim);
  letter-spacing:.02em;padding:12px 0 0;margin:0;text-transform:uppercase;
  white-space:nowrap;overflow:hidden}
.backup-link-row{display:flex;gap:6px}
.backup-link-row input{flex:1;min-width:0;background:var(--ink);border:1px solid var(--line);
  color:var(--txt);font-family:var(--mono);font-size:11px;padding:9px 10px;border-radius:var(--radius)}
.who-row{display:flex;gap:4px;align-items:center;flex-wrap:wrap;margin:-6px 0 16px;
  padding:8px 10px 10px}
.who-row:empty{display:none}
.who-row .chip{flex:0 0 auto;padding:5px 6px;font-size:10px;letter-spacing:.01em;white-space:nowrap}
.who-lbl{flex:0 0 54px;min-width:54px;white-space:nowrap;overflow:hidden;text-overflow:clip;
  font-family:var(--mono);font-size:10px;
  letter-spacing:.1em;color:var(--dim);text-transform:uppercase;margin-right:0}
.kind-lbl{flex:0 0 54px;min-width:54px;white-space:nowrap;overflow:hidden;text-overflow:clip;
  font-family:var(--body);font-size:11px;
  font-weight:700;color:var(--txt);margin-right:0}
.kind-row{background:var(--panel);border-radius:var(--radius)}
.chip[data-kindfilter="film"][data-on="1"]{background:var(--film);border-color:var(--film);color:var(--on-accent)}
.chip[data-kindfilter="serie"][data-on="1"]{background:var(--serie);border-color:var(--serie);color:var(--on-accent)}
.who-sel,.progress-sel{background:transparent;border:1px solid var(--line);color:var(--want);
  font-family:var(--mono);font-size:11px;font-weight:700;padding:10px 8px;min-height:44px;
  border-radius:var(--radius);-webkit-appearance:none;appearance:none;cursor:pointer}
.progress-sel{color:var(--sett)}
@media (hover: hover) and (pointer: fine){
  .who-sel:hover{border-color:var(--want)}
  .progress-sel:hover{border-color:var(--sett)}
}
.who-sel[data-set="1"]{border-color:var(--want);background:color-mix(in srgb, var(--want) 14%, transparent)}
.progress-sel[data-set="1"]{border-color:var(--sett);background:color-mix(in srgb, var(--sett) 14%, transparent)}
.who-sel:focus-visible{outline:2px solid var(--film);outline-offset:2px}

.tabs{display:flex;gap:2px;margin:16px 0 12px}
.search-row{display:flex;align-items:center;gap:0;margin-bottom:14px;position:relative}
.search-btn{position:absolute;left:0;top:0;background:none;border:none;color:var(--dim);
  cursor:pointer;width:44px;height:44px;font-size:17px;display:flex;align-items:center;justify-content:center}
.search-btn:hover{color:var(--txt)}
.search-input{width:100%;background:var(--panel);border:1px solid var(--line);color:var(--txt);
  font-family:var(--body);font-size:15px;padding:11px 96px 11px 44px;border-radius:var(--radius);
  -webkit-appearance:none;appearance:none}
.search-count{position:absolute;right:42px;top:50%;transform:translateY(-50%);
  font-family:var(--mono);font-size:10px;color:var(--dim);pointer-events:none;white-space:nowrap}
.search-input::placeholder{color:var(--dim)}
.search-input:focus-visible{outline:2px solid var(--film);outline-offset:2px}
.search-input::-webkit-search-cancel-button{display:none}
.search-clear{position:absolute;right:0;top:0;background:none;border:none;color:var(--dim);
  cursor:pointer;width:44px;height:44px;font-size:16px}
.search-clear:hover{color:var(--txt)}
.tab{flex:1;background:var(--panel);border:1px solid var(--line);color:var(--dim);
  font-family:var(--display);font-size:14px;letter-spacing:.09em;text-transform:uppercase;
  padding:10px 4px;cursor:pointer;border-radius:var(--radius);transition:.16s;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.tab:hover{color:var(--txt)}
.tab-label{display:block}
.tab-ic{display:block;font-size:14px;line-height:1;font-family:var(--body)}
.ic-empty{visibility:hidden}
.ic-want{color:var(--want);font-size:19px}
.ic-sett{color:var(--sett)}
.ic-fav{color:var(--fav)}
.tab[data-on] .tab-ic{color:var(--on-accent)}
.tab[data-on="film"]{background:var(--film);color:var(--on-accent);border-color:var(--film)}
.tab[data-on="serie"]{background:var(--serie);color:var(--on-accent);border-color:var(--serie)}
.tab[data-on="favorit"]{background:var(--fav);color:var(--on-accent);border-color:var(--fav)}
.tab[data-on="sett"]{background:var(--sett);color:var(--on-accent);border-color:var(--sett)}
.tab[data-on="villse"]{background:var(--want);color:var(--on-accent);border-color:var(--want)}
.tab b{font-family:var(--mono);font-size:11px;font-weight:700;margin-left:6px}

.ctrl{border:1px solid var(--line);background:var(--panel);padding:12px;margin-bottom:18px;border-radius:var(--radius)}
.lbl{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--dim);
  text-transform:uppercase;display:block;margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.06em;
  padding:6px 10px;border:1px solid var(--line);background:transparent;color:var(--dim);
  cursor:pointer;transition:.16s;border-radius:var(--radius)}
.chip[data-on="1"]{background:var(--film);color:var(--on-accent);border-color:var(--film);box-shadow:var(--shadow)}
.row2{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;align-items:center}
.fetch-status{font-family:var(--mono);font-size:11px;color:var(--dim);
  letter-spacing:.03em;margin:10px 0 0;line-height:1.5}
.fetch-status b{color:var(--txt);font-weight:700}
.btn{font-family:var(--display);font-size:14px;letter-spacing:.09em;text-transform:uppercase;
  background:var(--film);color:var(--on-accent);border:none;padding:11px 18px;cursor:pointer;border-radius:var(--radius)}
.btn:active{transform:translateY(1px)}
.btn-outline{background:transparent;color:var(--txt);border:1px solid var(--line)}
.btn-outline:hover{border-color:var(--txt)}

#page:empty{display:none}
.page-back{background:none;border:1px solid var(--line);color:var(--dim);font-family:var(--mono);
  font-size:12px;padding:8px 14px;border-radius:var(--radius);cursor:pointer;margin-bottom:16px}
.page-back:hover{color:var(--txt);border-color:var(--txt)}
.page-title{font-family:var(--display);font-size:22px;margin:0 0 4px;text-transform:none;letter-spacing:normal}
.match-add-btn{margin:8px 0 0;padding:7px 12px;font-size:12px;width:auto}
.match-added{font-family:var(--mono);font-size:12px;color:var(--sett);margin:8px 0 0}
.compare-count{font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--dim);
  text-transform:uppercase;margin:18px 0 10px}
.compare-count:first-of-type{margin-top:0}
.match-pickers{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
.match-check{display:flex;align-items:center;gap:7px;border:1px solid var(--line);
  border-radius:999px;padding:8px 14px 8px 10px;font-size:13px;cursor:pointer;
  background:var(--panel)}
.match-check input{width:17px;height:17px;flex:0 0 17px;accent-color:var(--film);cursor:pointer}
.match-check.is-disabled{opacity:.4}
.match-check.is-disabled input{cursor:not-allowed}
.match-shared-badge{font-family:var(--mono);font-size:9px;letter-spacing:.06em;
  color:var(--sett);text-transform:uppercase;border:1px solid var(--sett);
  border-radius:4px;padding:1px 5px;margin-left:4px}
.activity-badge{font-family:var(--mono);font-size:9px;letter-spacing:.06em;
  color:var(--on-accent);background:var(--want);text-transform:uppercase;
  border-radius:4px;padding:1px 5px;margin-left:4px;font-weight:700}
.select-wrap{position:relative;flex:1 1 160px}
.select-wrap:after{content:'▾';position:absolute;right:10px;top:50%;transform:translateY(-50%);
  color:var(--dim);pointer-events:none;font-size:11px}
.gsel{appearance:none;-webkit-appearance:none;width:100%;background:var(--ink);
  border:1px solid var(--line);color:var(--txt);font-family:var(--mono);font-size:12px;
  padding:10px 28px 10px 10px;cursor:pointer;border-radius:var(--radius)}
.chip:focus-visible,.tab:focus-visible,.btn:focus-visible,.heart:focus-visible,
.watch:focus-visible,.trash:focus-visible,.gsel:focus-visible,.rm-restore:focus-visible,
.title a:focus-visible{outline:2px solid var(--film);outline-offset:2px}

.item{display:flex;gap:14px;padding:16px 0;border-bottom:1px solid var(--line)}
.rail{width:52px;flex:0 0 52px;text-align:right;font-family:var(--mono);
  position:relative;padding-right:14px}
.rail:after{content:'';position:absolute;right:0;top:6px;bottom:-16px;width:1px;background:var(--line)}
.dot{position:absolute;right:-3px;top:6px;width:7px;height:7px;background:var(--film)}
.item[data-kind="serie"] .dot{background:var(--serie)}
.yr{font-size:15px;font-weight:700;line-height:1}
.md{font-size:10px;color:var(--dim);letter-spacing:.08em;margin-top:4px}
.poster-thumb{display:block;width:44px;height:44px;margin-top:8px;padding:0;
  border:1px solid var(--line);border-radius:6px;background:var(--panel);
  overflow:hidden;cursor:pointer;flex-shrink:0}
.poster-thumb img{display:block;width:100%;height:100%;object-fit:cover}
.rail[data-poster-open="1"]{width:150px !important;flex:0 0 150px !important}
.rail[data-poster-open="1"] .poster-thumb{width:100% !important;height:225px !important;
  border-radius:8px;margin-top:10px}
.poster-thumb-static{cursor:default}
@media (hover: hover) and (pointer: fine){
  .poster-thumb:hover{border-color:var(--dim)}
}
.body{flex:1;min-width:0}
.head{display:flex}
.title{font-family:var(--display);font-size:21px;font-weight:600;line-height:1.15;
  letter-spacing:.01em;margin:0}
.title a{color:inherit;text-decoration:none;border-bottom:1px solid transparent}
.title a:hover{border-bottom-color:var(--film)}
.meta{font-family:var(--mono);font-size:11px;color:var(--dim);margin:7px 0 0;
  letter-spacing:.05em;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.action-row{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin:9px 0 0}
.meta2{font-family:var(--mono);font-size:11px;color:var(--dim);margin:7px 0 0;
  letter-spacing:.05em;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.svc{color:var(--on-accent);background:var(--film);padding:2px 6px;font-weight:700;border-radius:calc(var(--radius) * .4)}
.item[data-kind="serie"] .svc{background:var(--serie)}
.imdb{color:var(--film);font-weight:700}
.rt{color:var(--rt);font-weight:700;text-decoration:none}
.rt:hover{text-decoration:underline}
.mc{color:var(--mc);font-weight:700;text-decoration:none}
.mc:hover{text-decoration:underline}
.rate-sel{background:transparent;border:1px solid var(--line);color:var(--mine);
  font-family:var(--mono);font-size:11px;font-weight:700;padding:2px 16px 2px 5px;margin-left:auto;
  border-radius:calc(var(--radius) * .4);-webkit-appearance:none;appearance:none;cursor:pointer;
  background-image:linear-gradient(45deg,transparent 50%,var(--mine) 50%),linear-gradient(135deg,var(--mine) 50%,transparent 50%);
  background-position:calc(100% - 9px) 50%,calc(100% - 5px) 50%;background-size:4px 4px;background-repeat:no-repeat}
@media (hover: hover) and (pointer: fine){
  .rate-sel:hover{border-color:var(--mine)}
}
.rate-sel[data-rated="1"]{border-color:var(--mine);background:rgba(201,166,255,.14)}
.rate-sel:focus-visible{outline:2px solid var(--film);outline-offset:2px}
.more-tog{background:none;border:none;color:var(--dim);font-family:var(--mono);font-size:11px;
  font-weight:700;letter-spacing:.04em;padding:0;margin:2px 0 0;cursor:pointer;
  display:flex;align-items:center;min-height:44px}
.more-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;
  margin:2px 0 4px;padding-top:8px;border-top:1px dashed var(--line)}
.more-row[hidden]{display:none}
.upcoming-season{font-family:var(--mono);font-size:12px;font-weight:700;
  color:var(--sett);letter-spacing:.02em;margin:8px 0 0}
.upcoming-today{color:var(--rt);font-size:13px}
.desc{font-size:14px;line-height:1.55;color:var(--desc);margin:8px 0 0}
.actions{display:flex;gap:8px;flex-shrink:0}
.heart:disabled,.watch:disabled,.trash:disabled,.star:disabled,
.rate-sel:disabled,.who-sel:disabled,.progress-sel:disabled{
  opacity:.35;cursor:not-allowed;filter:grayscale(1);
  background:rgba(128,128,128,.1)!important;border-color:var(--line)!important;
}
.heart,.watch,.trash,.star{background:none;border:1px solid var(--line);color:var(--dim);cursor:pointer;
  width:44px;height:44px;flex:0 0 44px;font-size:19px;line-height:1;transition:.16s;border-radius:var(--radius)}
.heart[data-on="1"]{color:var(--fav);border-color:var(--fav);background:rgba(255,127,154,.12)}
.watch{color:var(--dim2)}
.watch[data-on="1"]{color:var(--sett);border-color:var(--sett);background:rgba(124,255,155,.12)}
.star[data-on="1"]{color:var(--want);border-color:var(--want);background:rgba(255,169,77,.14)}
.trash{color:#FF6259;border-color:rgba(255,98,89,.4)}

  // Sällskapsalternativ för Vill se. De tre första är alltid med; därtill

  var THEME_KEY = "tipstablan:tema";

  var POOL = { film: [], serie: [] };
  var ALL_ITEMS = [];
  var BY_KEY = {};

    "Komedi": "Komedi", "Drama/Komedi": "Komedi", "Action/Komedi": "Komedi", "Dramakomedi": "Komedi",

    "Action/Kriminal": "Action & Äventyr", "Äventyr": "Action & Äventyr",

    "Sport/Drama": "Biografi & Sport", "Biografi/Sport": "Biografi & Sport",

    // TMDb:s engelska standardgenrer (används av titlar som hittas automatiskt
    // varje vecka) – mappade till samma tio fack som ovan.
    "Action & Adventure": "Action & Äventyr", "Adventure": "Action & Äventyr",
    "Western": "Action & Äventyr",
    "Comedy": "Komedi", "Romance": "Komedi",
    "Science Fiction": "Sci-fi & Fantasy", "Sci-Fi & Fantasy": "Sci-fi & Fantasy",

    "TV Movie": "Drama", "Kids": "Drama", "News": "Drama", "Soap": "Drama", "Talk": "Drama"
  };
  function genreBucket(g) { return GENRE_GROUPS[g] || g; }

  var GENRES = Array.from(new Set(ALL_ITEMS.map(function (it) { return genreBucket(it.genre); })))
    .sort(function (a, b) { return a.localeCompare(b, "sv"); });

  /* ============ hjälpare ============ */

  function parseDate(it) {
    var s = it.date;
    var d = new Date(s.length === 7 ? s + "-01" : s);
    return isNaN(d.getTime()) ? new Date("2021-01-01") : d;
  }
  function newestFirst(a, b) { return parseDate(b) - parseDate(a); }
  // Sorterar enligt användarens val; vid lika IMDb-betyg avgör datumet.
  function sortList(list) {
    var arr = list.slice();
    if (state.sort === "mine") {
      return arr.sort(function (a, b) {
        var av = state.ratings[keyOf(a)] || -1, bv = state.ratings[keyOf(b)] || -1;
        return (bv - av) || (parseDate(b) - parseDate(a));
      });
    }
    var field = { imdb: "imdb", rt: "rt", mc: "mc" }[state.sort];
    if (field) {
      return arr.sort(function (a, b) {
        // Titlar som saknar betyg hamnar sist i stället för överst.
        var av = a[field] || -1, bv = b[field] || -1;
        return (bv - av) || (parseDate(b) - parseDate(a));
      });
    }
    return arr.sort(newestFirst);
  }
  function keyOf(it) { return it.kind + ":" + it.title + ":" + it.date; }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  // Äldre versioner sparade hela objekt som favoriter; gör om till nycklar.
  function normalizeKeys(list) {
    if (!Array.isArray(list)) return [];
    return list.map(function (x) {
      if (typeof x === "string") return x;
      if (x && x.kind && x.title) return keyOf(x);
      return null;
    }).filter(Boolean);
  }

  var state = {
    tab: "film",
    activeProfile: ACTIVE_PROFILE,
    profiles: ALL_PROFILES.slice(),
    matchSelected: [],
    runtimeFilter: "",
    page: 1,
    theme: store.get(THEME_KEY) || "retro",
    active: SERVICES.slice(),
    genre: "",
    favorites: normalizeKeys(store.get(FAV_KEY())),
    watched: normalizeKeys(store.get(WATCHED_KEY())),
    wantToSee: normalizeKeys(store.get(WANT_KEY())),
    wantWho: store.get(WANTWHO_KEY()) || {},
    whoFilter: "",
    kindFilter: "",
    sort: "datum",
    removed: normalizeKeys(store.get(REMOVED_KEY())),
    ratings: store.get(RATING_KEY()) || {},
    seasonProgress: store.get(PROGRESS_KEY()) || {},
    lists: store.get(LISTS_KEY()) || {},
    viewingList: "",
    shareHint: null,
    expandedLists: {},
    returnTab: "film",
    expanded: {},
    expandedProgress: {},
    posterExpanded: {},
    search: "",
    shown: { film: [], serie: [] }
  };

  // Läser om alla profil-specifika fält från lagringen för den nu aktiva
  // profilen. Används både vid start och varje gång man byter profil.
  function loadProfileData() {
    state.favorites = normalizeKeys(store.get(FAV_KEY()));
    state.watched = normalizeKeys(store.get(WATCHED_KEY()));
    state.wantToSee = normalizeKeys(store.get(WANT_KEY()));
    state.wantWho = store.get(WANTWHO_KEY()) || {};
    state.removed = normalizeKeys(store.get(REMOVED_KEY()));
    state.ratings = store.get(RATING_KEY()) || {};
    state.seasonProgress = store.get(PROGRESS_KEY()) || {};

  }

  function closeMenu() {
    document.getElementById("menuDropdown").classList.remove("open");
    document.getElementById("menuBtn").setAttribute("aria-expanded", "false");
    document.getElementById("themeOptions").hidden = true;
    document.getElementById("themeToggle").setAttribute("aria-expanded", "false");
  }

  /* ============ Egna listor ============ */

  function saveLists() {
    store.set(LISTS_KEY(), state.lists);
    maybePushActiveProfileToCloud();
  }

  function createList(name) {
    name = (name || "").trim().slice(0, 40);
    if (!name) return false;
    if (state.lists.hasOwnProperty(name)) {
      alert("Du har redan en lista som heter \"" + name + "\".");
      return false;
    }
    state.lists[name] = [];
    saveLists();
    return true;
  }

  function renameList(oldName, newName) {
    newName = (newName || "").trim().slice(0, 40);
    if (!newName || newName === oldName) return;
    if (state.lists.hasOwnProperty(newName)) {
      alert("Du har redan en lista som heter \"" + newName + "\".");
      return;
    }
    state.lists[newName] = state.lists[oldName];
    delete state.lists[oldName];
    if (state.viewingList === oldName) state.viewingList = newName;
    saveLists();
  }

  function deleteList(name) {
    if (!confirm("Ta bort listan \"" + name + "\"? Titlarna själva påverkas inte, bara listan.")) return;
    delete state.lists[name];
    saveLists();
  }

  function toggleListMembership(listName, key) {
    var members = state.lists[listName] || [];
    var idx = members.indexOf(key);
    if (idx === -1) members.push(key);
    else members.splice(idx, 1);
    state.lists[listName] = members;
    saveLists();
  }

  function markProfileSeen(name) {
    store.set("tipstablan:lastseen:" + name, {
      fav: store.get(BASE_FAV + ":" + name) || [],
      want: store.get(BASE_WANT + ":" + name) || []
    });
  }

  // Räknar nya favoriter/vill-se-tillägg sedan profilen senast visades -
  // bara relevant för mottagna (delade) profiler, som kan ändras i
  // bakgrunden utan att man aktivt tittar på dem.
  function getActivityCount(name) {
    if (!isReceivedProfile(name)) return 0;
    var seen = store.get("tipstablan:lastseen:" + name);
    if (!seen) return 0;
    var curFav = store.get(BASE_FAV + ":" + name) || [];
    var curWant = store.get(BASE_WANT + ":" + name) || [];
    var newFav = curFav.filter(function (k) { return seen.fav.indexOf(k) === -1; }).length;
    var newWant = curWant.filter(function (k) { return seen.want.indexOf(k) === -1; }).length;
    return newFav + newWant;
  }

  function switchProfile(name, keepTab) {
    if (name === ACTIVE_PROFILE) return;
    ACTIVE_PROFILE = name;
    state.activeProfile = name;
    store.set(ACTIVE_PROFILE_KEY, name);
    if (isReceivedProfile(name)) markProfileSeen(name);
    loadProfileData();
    state.expanded = {};
    state.whoFilter = "";
    state.kindFilter = "";
    state.search = "";
    if (!keepTab) {
      state.tab = "film";
      state.returnTab = "film";
    }
    drawAll();
    render();
  }

  function renameActiveProfile(newName) {
    newName = (newName || "").trim();
    if (!newName || newName === ACTIVE_PROFILE) return;
    if (state.profiles.indexOf(newName) !== -1) {
      alert("Det namnet används redan av en annan profil.");
      return;
    }
    var oldName = ACTIVE_PROFILE;
    PROFILE_BASE_KEYS.forEach(function (base) {
      var v = store.get(base + ":" + oldName);
      if (v !== null) store.set(base + ":" + newName, v);
      store.remove(base + ":" + oldName);
    });
    // Flytta med ett eventuellt delnings-ID, annars tappar profilen
    // sin molnsynk tyst (appen skulle leta efter ett ID under det NYA
    // namnet och inte hitta något).
    var shareId = getShareId(oldName);
    if (shareId) {
      store.set("tipstablan:shareid:" + newName, shareId);
      store.remove("tipstablan:shareid:" + oldName);
    }
    var idx = state.profiles.indexOf(oldName);
    if (idx !== -1) state.profiles[idx] = newName;
    store.set(PROFILES_KEY, state.profiles);
    ACTIVE_PROFILE = newName;
    state.activeProfile = newName;
    store.set(ACTIVE_PROFILE_KEY, newName);
    if (shareId) pushProfileToCloud(newName, shareId); // uppdaterar namnet hos mottagaren också
    render();
  }

  function deleteProfile(name) {
    if (name === ACTIVE_PROFILE) return; // görs inte via UI, men skyddar ändå
    if (!confirm("Ta bort profilen \"" + name + "\" och all dess sparade data?\n\nGår inte att ångra.")) return;
    PROFILE_BASE_KEYS.forEach(function (base) {
      store.remove(base + ":" + name);
    });
    if (activeSubscriptions[name]) { activeSubscriptions[name](); delete activeSubscriptions[name]; }
    store.remove("tipstablan:shareid:" + name);
    store.remove("tipstablan:received-shareid:" + name);
    state.profiles = state.profiles.filter(function (p) { return p !== name; });
    store.set(PROFILES_KEY, state.profiles);
    render();
  }

  /* ============ Dela profil & molnsynk ============ */

  function genShareId() {
    var chars = "abcdefghjkmnpqrstuvwxyz23456789"; // undviker lätt förväxlade tecken (0/o, 1/l/i)
    var out = "";
    for (var i = 0; i < 14; i++) out += chars[Math.floor(Math.random() * chars.length)];
    return out;
  }

  function isReceivedProfile(name) {
    return !!store.get("tipstablan:received-shareid:" + name);
  }

  function getShareId(name) {
    return store.get("tipstablan:shareid:" + name);
  }

  // Skickar DEN AKTIVA profilens aktuella data till molnet, men bara om
  // den profilen faktiskt är delad (har ett shareId sedan tidigare).
  // Anropas efter varje ändring (favorit, betyg, osv.) - no-op annars.
  function maybePushActiveProfileToCloud() {
    if (!cloudReady || isReceivedProfile(state.activeProfile)) return;
    var shareId = getShareId(state.activeProfile);
    if (!shareId) return;
    pushProfileToCloud(state.activeProfile, shareId);
  }

  function pushProfileToCloud(profileName, shareId) {
    if (!cloudReady) return;
    db.collection("profiles").doc(shareId).set({
      name: profileName,
      fav: store.get(BASE_FAV + ":" + profileName) || [],
      watched: store.get(BASE_WATCHED + ":" + profileName) || [],
      want: store.get(BASE_WANT + ":" + profileName) || [],
      who: store.get(BASE_WANTWHO + ":" + profileName) || {},
      ratings: store.get(BASE_RATING + ":" + profileName) || {},
      progress: store.get(BASE_PROGRESS + ":" + profileName) || {},
      lists: store.get(BASE_LISTS + ":" + profileName) || {},
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    }).catch(function () { /* nätverksfel etc - försöker igen vid nästa ändring */ });
  }

  // Delar den aktiva profilen via telefonens delningsmeny (mail/sms/
  // AirDrop osv.) om det stödjs, annars kopieras länken till urklipp.
  function shareActiveProfile() {
    if (!cloudReady) {
      alert("Molnsynk är inte konfigurerat i den här installationen än.");
      return;
    }
    var name = state.activeProfile;
    var shareId = getShareId(name);

    // Första delningen (eller standardnamnet "Jag"): be om ett namn som
    // mottagaren känner igen, t.ex. förnamnet. Profilen döps om lokalt.
    if (!shareId || name === "Jag") {
      var wanted = prompt(
        "Vad ska mottagaren kalla din profil? Använd t.ex. ditt förnamn – " +
        "det är namnet de ser i sin app.",
        name === "Jag" ? "" : name
      );
      if (wanted === null) return; // avbröt
      wanted = wanted.trim().slice(0, 40);
      if (!wanted) { alert("Skriv ett namn så mottagaren vet vems profil det är."); return; }
      if (wanted === "Jag") { alert("\"Jag\" blir förvirrande för mottagaren – välj t.ex. ditt förnamn."); return; }
      if (wanted !== name) {
        renameActiveProfile(wanted);
        if (state.activeProfile !== wanted) return; // namnet var upptaget, felmeddelande visades redan
        name = wanted;
      }
      shareId = getShareId(name);
    }

    if (!shareId) {
      shareId = genShareId();
      store.set("tipstablan:shareid:" + name, shareId);
    }
    pushProfileToCloud(name, shareId);

    var url = location.origin + location.pathname + "?share=" + shareId + "&n=" + encodeURIComponent(name);
    if (navigator.share) {
      navigator.share({ title: "FILMoSERIER – " + name, text: "Följ " + name + "s profil i FILMoSERIER", url: url }).catch(function () {});
    } else if (navigator.clipboard) {
      navigator.clipboard.writeText(url).then(function () {
        alert("Länk kopierad till urklipp:\n" + url);
      }).catch(function () { prompt("Kopiera länken:", url); });
    } else {
      prompt("Kopiera länken:", url);
    }
    render();
  }

  var activeSubscriptions = {}; // profilnamn -> avprenumereringsfunktion

  function subscribeToSharedProfile(profileName, shareId) {
    if (!cloudReady || activeSubscriptions[profileName]) return;
    activeSubscriptions[profileName] = db.collection("profiles").doc(shareId)
      .onSnapshot(function (doc) {
        if (!doc.exists) return;
        var data = doc.data();
        store.set(BASE_FAV + ":" + profileName, normalizeKeys(data.fav));
        store.set(BASE_WATCHED + ":" + profileName, normalizeKeys(data.watched));
        store.set(BASE_WANT + ":" + profileName, normalizeKeys(data.want));
        store.set(BASE_WANTWHO + ":" + profileName, data.who || {});
        store.set(BASE_RATING + ":" + profileName, data.ratings || {});
        store.set(BASE_PROGRESS + ":" + profileName, data.progress || {});
        store.set(BASE_LISTS + ":" + profileName, data.lists || {});
        if (state.activeProfile === profileName) { loadProfileData(); drawAll(); }
        render();
      }, function () { /* tappad anslutning - localStorage har senast kända data kvar */ });
  }

  function resubscribeAllReceived() {
    state.profiles.forEach(function (p) {
      var shareId = store.get("tipstablan:received-shareid:" + p);
      if (shareId) subscribeToSharedProfile(p, shareId);
    });
  }

  function isStandalone() { return window.navigator.standalone === true; }

  // Tar emot en delad profil. fromLink = öppnad via en länk (webbadressen)
  // i motsats till inklistrad manuellt i hemskärmsappen.
  function receiveShare(shareId, sharedName, fromLink) {
    if (!cloudReady) return;
    sharedName = (sharedName || "Delad profil").slice(0, 40);

    var already = state.profiles.some(function (p) {
      return store.get("tipstablan:received-shareid:" + p) === shareId;
    });
    if (already) {
      if (!fromLink) alert("Du följer redan den profilen.");
      return;
    }

    var isOwnShare = state.profiles.some(function (p) { return getShareId(p) === shareId; });
    if (isOwnShare) {
      alert("Det här är din egen delade profil – inget att ta emot.");
      return;
    }

    var displayName = sharedName;
    if (state.profiles.indexOf(displayName) !== -1) displayName = sharedName + " (delad)";
    var linkUrl = location.origin + location.pathname + "?share=" + shareId + "&n=" + encodeURIComponent(sharedName);

    db.collection("profiles").doc(shareId).get().then(function (doc) {
      if (!doc.exists) { alert("Hittade ingen delad profil med den länken."); return; }
      var data = doc.data();
      applyBackupObj({ fav: data.fav, watched: data.watched, want: data.want, who: data.who, ratings: data.ratings, progress: data.progress, lists: data.lists }, displayName);
      store.set("tipstablan:received-shareid:" + displayName, shareId);
      markProfileSeen(displayName);
      subscribeToSharedProfile(displayName, shareId);
      // Länkar öppnas alltid i Safari på iOS, som har egen lagring skild från
      // hemskärmsappen. Visa då en tydlig ruta med "Kopiera länk".
      if (fromLink && !isStandalone()) state.shareHint = { name: displayName, url: linkUrl };
      render();
      alert("Du följer nu \"" + displayName + "\"s profil – den uppdateras automatiskt.");
    }).catch(function () {
      alert("Kunde inte hämta den delade profilen just nu. Testa igen senare.");
    });
  }

  // Plockar ut delnings-ID och namn ur en inklistrad länk (eller bara ett ID).
  function parseShareInput(text) {
    text = (text || "").trim();
    var out = { id: "", name: "" };
    var m = /[?&]share=([a-z0-9]+)/i.exec(text);
    if (m) {
      out.id = m[1];
      var n = /[?&]n=([^&\s]+)/.exec(text);
      if (n) {
        try { out.name = decodeURIComponent(n[1].replace(/\+/g, " ")); } catch (e) { out.name = n[1]; }
      }
    } else if (/^[a-z0-9]{8,30}$/i.test(text)) {
      out.id = text;
    }
    return out;
  }

  // Kollar efter ?share=... i webbadressen (öppnad via en delad länk).
  function checkIncomingShare() {
    if (!cloudReady) return;
    var params = new URLSearchParams(location.search);
    var shareId = params.get("share");
    if (!shareId) return;
    var sharedName = params.get("n") || "Delad profil";
    history.replaceState({}, "", location.pathname);
    receiveShare(shareId, sharedName, true);
  }

  /* ============ backup via fil ============
     Enkel export/import: en nedladdad JSON-fil med favoriter, sett,
     vill se, sällskap, betyg och borttaget. Funkar likadant i Safari
     och i hemskärmsappen, oavsett webbadressens längd eller iOS
     ikon-cache – det är bara en vanlig fil.
  ==================================== */

  function buildBackupObj() {
    return {
      profileName: state.activeProfile,
      fav: state.favorites, watched: state.watched, want: state.wantToSee,
      who: state.wantWho, removed: state.removed, ratings: state.ratings,
      progress: state.seasonProgress, lists: state.lists
    };
  }

  // Säkerhetsspärr: importerad JSON kan i princip innehålla vad som helst.
  // Plockar bara ut egna, oskadliga nycklar/värden, och stryker uttryckligen
  // farliga objektnycklar (__proto__ m.fl.) om koden någon gång skulle byggas
  // om till en nyckel-för-nyckel-kopiering istället för en hel referens.
  function sanitizeObj(o, valueCheck) {
    var out = {};
    if (!o || typeof o !== "object" || Array.isArray(o)) return out;
    Object.keys(o).forEach(function (k) {
      if (k === "__proto__" || k === "constructor" || k === "prototype") return;
      if (typeof k !== "string" || k.length > 200) return;
      var v = o[k];
      if (valueCheck && !valueCheck(v)) return;
      out[k] = v;
    });
    return out;
  }

  // Skriver importerad data till EN VALD PROFILS lagring - inte nödvändigtvis
  // den som är aktiv just nu. Om profilen är ny läggs den till i listan.
  // Uppdaterar bara den synliga vyn (state.*) om det är den aktiva profilen.
  function applyBackupObj(b, targetProfile) {
    var favorites = normalizeKeys(b.fav);
    var watched = normalizeKeys(b.watched);
    var wantToSee = normalizeKeys(b.want);
    var wantWho = sanitizeObj(b.who, function (v) { return typeof v === "string" && v.length < 50; });
    var removed = normalizeKeys(b.removed);
    var ratings = sanitizeObj(b.ratings, function (v) {
      return typeof v === "number" && v >= 1 && v <= 10;
    });
    var progress = sanitizeObj(b.progress, function (v) {
      return typeof v === "number" && v >= 0 && v <= 100;
    });
    var rawLists = sanitizeObj(b.lists, function (v) { return Array.isArray(v); });
    var lists = {};
    Object.keys(rawLists).forEach(function (name) { lists[name] = normalizeKeys(rawLists[name]); });

    store.set(BASE_FAV + ":" + targetProfile, favorites);
    store.set(BASE_WATCHED + ":" + targetProfile, watched);
    store.set(BASE_WANT + ":" + targetProfile, wantToSee);
    store.set(BASE_WANTWHO + ":" + targetProfile, wantWho);
    store.set(BASE_REMOVED + ":" + targetProfile, removed);
    store.set(BASE_RATING + ":" + targetProfile, ratings);
    store.set(BASE_PROGRESS + ":" + targetProfile, progress);
    store.set(BASE_LISTS + ":" + targetProfile, lists);

    if (state.profiles.indexOf(targetProfile) === -1) {
      state.profiles.push(targetProfile);
      store.set(PROFILES_KEY, state.profiles);
    }

    if (targetProfile === ACTIVE_PROFILE) {
      loadProfileData();
    }
  }

  function exportBackupFile() {
    var data = JSON.stringify(buildBackupObj(), null, 2);
    var blob = new Blob([data], { type: "application/json" });
    var url = URL.createObjectURL(blob);
    var d = new Date();
    var stamp = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") +
      "-" + String(d.getDate()).padStart(2, "0");
    var a = document.createElement("a");
    a.href = url;
    a.download = "FILMoSERIER-" + state.activeProfile + "-" + stamp + ".json";
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
  }

  function importBackupFile(file) {
    var reader = new FileReader();
    reader.onload = function () {
      var incoming;
      try {
        incoming = JSON.parse(String(reader.result));
      } catch (e) {
        alert("Kunde inte läsa filen. Är det en export från den här appen?");
        return;
      }

      var suggested = (incoming.profileName && String(incoming.profileName).trim()) || "";
      var name = prompt(
        "Vilket namn hör den här datan till?\n\n" +
        "Redan sparade profiler: " + state.profiles.join(", "),
        suggested
      );
      if (name === null) return; // avbrutet
      name = name.trim();
      if (!name) { alert("Namnet kan inte vara tomt."); return; }

      var isActive = name === ACTIVE_PROFILE;
      var isExistingOther = !isActive && state.profiles.indexOf(name) !== -1;
      var isNew = state.profiles.indexOf(name) === -1;

      var proceed = true;
      if (isActive) {
        proceed = confirm("Skriva över din nuvarande profil (\"" + name + "\") med datan från filen?");
      } else if (isExistingOther) {
        proceed = confirm(
          "\"" + name + "\" finns redan som en sparad profil.\n\n" +
          "Skriva över den profilens data med filen? Din egen aktiva profil (\"" + ACTIVE_PROFILE + "\") påverkas inte."
        );
      }
      if (!proceed) return;

      applyBackupObj(incoming, name);

      if (isActive) {
        drawAll();
        render();
      } else {
        render(); // uppdaterar profil-väljaren med ev. ny profil, men byter inte vy
        if (isNew && confirm("\"" + name + "\" har lagts till som ny profil. Vill du växla till den nu?")) {
          switchProfile(name);
        }
      }

      var statusEl = document.getElementById("backupStatus2");
      if (statusEl) {
        statusEl.textContent = "✓ Importerat till \"" + name + "\"";
        setTimeout(function () { statusEl.textContent = ""; }, 3000);
      }
    };
    reader.readAsText(file);
  }

  /* ============ urval ============ */

  // Diakritik-okänslig, versal-okänslig normalisering (t.ex. "shogun" hittar "Shōgun").
  function normSearch(s) {
    return String(s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
  }

  // Plockar ut minuter ur en filmlängd ("2 tim 36 min" / "45 min").
  // Returnerar null för sådant som inte är en speltid (t.ex. "1 säsong") -
  // serier påverkas alltså aldrig av filtret, bara filmer.
  function parseRuntimeMinutes(lengthStr) {
    var h = /(\d+)\s*tim/.exec(lengthStr);
    var m = /(\d+)\s*min/.exec(lengthStr);
    if (!h && !m) return null;
    return (h ? parseInt(h[1], 10) * 60 : 0) + (m ? parseInt(m[1], 10) : 0);
  }
  function matchesRuntimeFilter(it) {
    if (!state.runtimeFilter) return true;
    var mins = parseRuntimeMinutes(it.length);
    if (mins === null) return true;
    if (state.runtimeFilter === "short") return mins < 60;
    if (state.runtimeFilter === "medium") return mins >= 60 && mins <= 120;
    if (state.runtimeFilter === "long") return mins > 120;
    return true;
  }

  function draw(kind) {
    var q = state.search ? normSearch(state.search) : "";
    var pool = POOL[kind].filter(function (it) {
      if (state.active.indexOf(it.service) === -1) return false;
      if (state.genre && genreBucket(it.genre) !== state.genre) return false;
      if (!matchesRuntimeFilter(it)) return false;
      if (state.removed.indexOf(keyOf(it)) !== -1) return false;
      if (state.watched.indexOf(keyOf(it)) !== -1) return false;
      if (state.wantToSee.indexOf(keyOf(it)) !== -1) return false;
      if (q && normSearch(it.title).indexOf(q) === -1) return false;
      return true;
    });
    return sortList(pool);
  }

  function resolveList(keys, applyWhoFilter) {
    var q = state.search ? normSearch(state.search) : "";
    var list = keys.map(function (k) { return BY_KEY[k]; })
      .filter(function (it) { return it && (!state.genre || genreBucket(it.genre) === state.genre); })
      .filter(matchesRuntimeFilter)
      .filter(function (it) { return !q || normSearch(it.title).indexOf(q) !== -1; })
      .filter(function (it) { return !state.kindFilter || it.kind === state.kindFilter; });
    if (applyWhoFilter && state.whoFilter) {
      list = list.filter(function (it) {
        return (state.wantWho[keyOf(it)] || "") === state.whoFilter;
      });
    }
    return sortList(list);
  }

  // Läser en GODTYCKLIG profils Vill se-lista direkt ur lagringen (inte
  // nödvändigtvis den aktiva profilen) - används bara för jämförelsen.
  function getProfileWantToSee(profileName) {
    return normalizeKeys(store.get(BASE_WANT + ":" + profileName));
  }

  var MATCH_MAX = 10;

  // Räknar för varje titel hur många av de valda profilerna som vill se
  // den, och grupperar efter antal (flest röster först). Visar bara
  // grupper med en majoritet (mer än hälften) - vid två profiler
  // betyder det samma sak som "båda", precis som tidigare.
  function computeMatches(profiles) {
    var counts = {}; // key -> antal profiler som vill se den
    profiles.forEach(function (p) {
      getProfileWantToSee(p).forEach(function (k) {
        counts[k] = (counts[k] || 0) + 1;
      });
    });
    var minMajority = Math.floor(profiles.length / 2) + 1;
    var groups = {}; // antal -> [titel, ...]
    Object.keys(counts).forEach(function (k) {
      var n = counts[k];
      if (n < minMajority) return;
      var it = BY_KEY[k];
      if (!it) return;
      (groups[n] = groups[n] || []).push(it);
    });
    return Object.keys(groups)
      .map(Number)
      .sort(function (a, b) { return b - a; })
      .map(function (n) { return { count: n, items: groups[n].sort(newestFirst) }; });
  }

  function matchCheckboxHtml(p) {

    return '<article class="item" data-kind="' + it.kind + '">' +

      '</div><div class="md">' + rest + "</div>" +

  function renderComparePage() {
    var html = '<button class="page-back" id="pageBack">← Tillbaka</button>' +
      '<h2 class="page-title">Matcha profiler</h2>';

    if (state.profiles.length < 2) {
      html += '<div class="empty"><p>Behöver minst två profiler</p>' +
        '<span>Dela eller ta emot en delad profil under Profiler &amp; Backup för att kunna matcha.</span></div>';
      document.getElementById("page").innerHTML = html;
      return;
    }

    if (!state.matchSelected || !state.matchSelected.length) {
      state.matchSelected = state.profiles.slice(0, MATCH_MAX);
    } else {
      state.matchSelected = state.matchSelected.filter(function (p) { return state.profiles.indexOf(p) !== -1; });
      if (!state.matchSelected.length) state.matchSelected = state.profiles.slice(0, MATCH_MAX);
    }

    html += '<p style="color:var(--dim);font-size:13px;margin:0 0 10px">Välj upp till tio profiler (' +
      state.matchSelected.length + '/' + MATCH_MAX + ' valda). Visar titlar en majoritet av de valda markerat med ★ Vill se.</p>' +
      '<div class="match-pickers">' + state.profiles.map(matchCheckboxHtml).join("") + "</div>";

    if (state.matchSelected.length < 2) {
      html += '<div class="empty"><p>Välj minst två profiler</p><span></span></div>';
    } else {
      var groups = computeMatches(state.matchSelected);
      if (!groups.length) {
        html += '<div class="empty"><p>Inga gemensamma titlar än</p>' +
          '<span>Inget som en majoritet av de valda profilerna har markerat med ★ Vill se.</span></div>';
      } else {
        html += groups.map(function (g) {
          return '<p class="compare-count">' + g.count + " av " + state.matchSelected.length +
            (g.count === state.matchSelected.length ? " – alla" : "") + " vill se (" +
            g.items.length + (g.items.length === 1 ? " titel" : " titlar") + ")</p>" +
            g.items.map(compareCard).join("");
        }).join("");
      }
    }

    document.getElementById("page").innerHTML = html;
  }

  function render() {
    var isPage = state.tab === "backup" || state.tab === "removed" || state.tab === "info" || state.tab === "compare" || state.tab === "history" || state.tab === "random" || state.tab === "lists" || state.tab === "listview";
    document.getElementById("tabs").style.display = isPage ? "none" : "";
    document.querySelector(".search-row").style.display = isPage ? "none" : "";
    document.querySelector(".ctrl").style.display = isPage ? "none" : "";
    document.getElementById("runtimeRow").style.display = (state.tab === "serie") ? "none" : "";
    document.getElementById("randomBtnRow").hidden = !(state.tab === "villse" && state.wantToSee.length > 0);
    document.getElementById("list").style.display = isPage ? "none" : "";
    document.getElementById("pager").style.display = isPage ? "none" : "";
    document.getElementById("pagerTop").style.display = isPage ? "none" : "";
    document.getElementById("foot").style.display = isPage ? "none" : "";
    document.getElementById("whoRow").innerHTML = "";
    document.getElementById("kindRow").innerHTML = "";
    var hintBox = document.getElementById("shareHintBox");
    hintBox.innerHTML = (state.shareHint && !isPage)
      ? '<div class="share-hint"><p><b>' + esc(state.shareHint.name) + '</b> är mottagen här i webbläsaren. ' +
        'Använder du appen från hemskärmen? Den har egen lagring – kopiera länken och klistra in den där ' +
        'under <b>Profiler &amp; Backup → Ta emot delad profil</b>.</p>' +
        '<button class="btn btn-outline" id="copyShareHintBtn">Kopiera länk</button> ' +
        '<button class="btn btn-outline" id="closeShareHintBtn">Stäng</button></div>'
      : "";
    var roBanner = document.getElementById("readonlyBanner");
    roBanner.innerHTML = (!isPage && isReceivedProfile(state.activeProfile))
      ? '<p class="readonly-banner">👁 Visar <b>' + esc(state.activeProfile) + '</b>s profil – skrivskyddad, synkas automatiskt</p>'
      : "";
    var menuCount = document.getElementById("menuRemovedCount");
    if (menuCount) menuCount.textContent = "(" + state.removed.length + ")";
    document.getElementById("foot").innerHTML =
      '<button class="foot-link" data-tab="film">🏠 Till startsidan</button>' +
      '<button class="foot-link" data-page="info">ℹ Info &amp; förklaring</button>';

    if (isPage) {
      if (state.tab === "backup") renderBackupPage();
      else if (state.tab === "info") renderInfoPage();
      else if (state.tab === "compare") renderComparePage();
      else if (state.tab === "history") renderHistoryPage();
      else if (state.tab === "random") renderRandomPage();
      else if (state.tab === "lists") renderListsPage();
      else if (state.tab === "listview") renderListViewPage();
      else renderRemovedPage();
      return;
    }
    document.getElementById("page").innerHTML = "";

    renderTabs();
    renderChips();

    // Film/serie-filter visas i Favorit-, Sett- och Vill se-flikarna.
    var kindEl = document.getElementById("kindRow");
    var kindSourceKeys = { favorit: state.favorites, sett: state.watched, villse: state.wantToSee }[state.tab];
    if (kindSourceKeys) {
      var q0 = state.search ? normSearch(state.search) : "";
      var kindBase = kindSourceKeys.map(function (k) { return BY_KEY[k]; })
        .filter(function (it) { return it && (!state.genre || genreBucket(it.genre) === state.genre); })
        .filter(function (it) { return !q0 || normSearch(it.title).indexOf(q0) !== -1; });
      var filmCount = kindBase.filter(function (it) { return it.kind === "film"; }).length;
      var serieCount = kindBase.filter(function (it) { return it.kind === "serie"; }).length;
      var kindRows = [["", "Alla", kindBase.length], ["film", "Film", filmCount], ["serie", "Serie", serieCount]];
      kindEl.innerHTML = '<span class="kind-lbl">Sortera:</span>' + kindRows
        .map(function (kv) {
          return '<button class="chip" data-kindfilter="' + esc(kv[0]) + '" data-on="' +
            (state.kindFilter === kv[0] ? 1 : 0) + '" aria-pressed="' +
            (state.kindFilter === kv[0]) + '">' + esc(kv[1]) + " (" + kv[2] + ")</button>";
        }).join("");
    } else {
      kindEl.innerHTML = "";
    }

    // Sällskapsfilter visas bara i Vill se-fliken.
    var whoEl = document.getElementById("whoRow");
    if (state.tab === "villse") {
      var whoOptionsForFilter = getWhoOptions();
      var counts = {};
      whoOptionsForFilter.forEach(function (w) { counts[w.id] = 0; });
      state.wantToSee.forEach(function (k) {
        var w = state.wantWho[k];
        if (w && counts[w] !== undefined) counts[w]++;
      });
      var rows = [["", "Alla", state.wantToSee.length]].concat(
        whoOptionsForFilter.map(function (w) { return [w.id, w.label, counts[w.id]]; })
      );
      whoEl.innerHTML = '<span class="who-lbl">Se med:</span>' +
        rows
          .map(function (w) {
            return '<button class="chip" data-who="' + esc(w[0]) + '" data-on="' +
              (state.whoFilter === w[0] ? 1 : 0) + '" aria-pressed="' +
              (state.whoFilter === w[0]) + '">' + esc(w[1]) + " (" + w[2] + ")</button>";
          }).join("");
    }

    var list;
    if (state.tab === "favorit") list = resolveList(state.favorites);
    else if (state.tab === "sett") list = resolveList(state.watched);
    else if (state.tab === "villse") list = resolveList(state.wantToSee, true);
    else list = state.shown[state.tab];

    var countEl = document.getElementById("searchCount");
    countEl.textContent = state.search
      ? (list.length === 1 ? "1 träff" : list.length + " träffar")
      : "";

    var el = document.getElementById("list");
    var pagerEl = document.getElementById("pager");
    var pagerTopEl = document.getElementById("pagerTop");
    if (!list.length) {
      var villseHint = state.whoFilter
        ? "Inget är märkt för det sällskapet än. Välj Alla, eller märk en titel nedan."
        : "Tryck på stjärnan vid ett tips för att lägga det här.";
      var msg, hint;
      if (state.search) {
        msg = "Inga träffar på \u201c" + state.search + "\u201d";
        hint = "Prova ett annat sökord, eller rensa sökningen.";
      } else {
        msg = { film: "Inga tips i listan", serie: "Inga tips i listan",
                    sett: "Inget markerat som sett",
                    villse: state.whoFilter ? "Inget för det sällskapet" : "Inget i Vill se än",
                    favorit: "Inga favoriter än" }[state.tab];
        hint = { film: "Markera minst en av tjänsterna ovan.",
                   serie: "Markera minst en av tjänsterna ovan.",
                   sett: "Tryck på bocken vid ett tips för att lägga det här.",
                   villse: villseHint,
                   favorit: "Tryck på hjärtat vid ett tips så hamnar det här." }[state.tab];
      }
      el.innerHTML = '<div class="empty"><p>' + esc(msg) + "</p><span>" + hint + "</span></div>";
      pagerEl.innerHTML = "";
      pagerTopEl.innerHTML = "";
    } else {
      var PAGE_SIZE = 10;
      var totalPages = Math.max(1, Math.ceil(list.length / PAGE_SIZE));
      if (state.page > totalPages) state.page = totalPages;
      if (state.page < 1) state.page = 1;
      var pageList = list.slice((state.page - 1) * PAGE_SIZE, state.page * PAGE_SIZE);
      el.innerHTML = pageList.map(card).join("");

      if (totalPages <= 1) {
        pagerEl.innerHTML = "";
        pagerTopEl.innerHTML = "";
      } else {
        pagerEl.innerHTML =
          '<button class="pager-btn" id="pagerPrev"' + (state.page <= 1 ? " disabled" : "") + '>‹ Föregående</button>' +
          '<span class="pager-info">Sida ' + state.page + " av " + totalPages + "</span>" +
          '<button class="pager-btn" id="pagerNext"' + (state.page >= totalPages ? " disabled" : "") + ">Nästa ›</button>";
        pagerTopEl.innerHTML = '<span class="pager-info">Sida ' + state.page + " av " + totalPages + "</span>";
      }
    }
  }

  /* ============ händelser ============ */

  (function () {
    var startX = 0, startY = 0, tracking = false;
    var listEl = document.getElementById("list");

    listEl.addEventListener("touchstart", function (e) {
      if (e.touches.length !== 1) { tracking = false; return; }
      startX = e.touches[0].clientX;
      startY = e.touches[0].clientY;
      tracking = true;
    }, { passive: true });

    listEl.addEventListener("touchend", function (e) {
      if (!tracking) return;
      tracking = false;
      var t = e.changedTouches[0];
      var dx = t.clientX - startX;
      var dy = t.clientY - startY;
      // Kräver en tydlig, huvudsakligen horisontell rörelse - annars är
      // det bara vanlig vertikal scroll och ska inte byta sida.
      if (Math.abs(dx) < 60 || Math.abs(dx) < Math.abs(dy) * 1.3) return;
      state.page += dx < 0 ? 1 : -1; // render() klampar till giltigt intervall
      render();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }, { passive: true });
  })();

  document.addEventListener("click", function (e) {
    // Stänger hamburgarmenyn vid klick utanför den. Måste köras innan
    // knapp-filtreringen nedan, eftersom bakgrundsklick inte är en knapp.
    var dd = document.getElementById("menuDropdown");
    if (dd.classList.contains("open") &&
        !e.target.closest("#menuDropdown") && !e.target.closest("#menuBtn")) {
      closeMenu();
    }

    var t = e.target.closest("button");
    if (!t) return;

    // Kortknapparna byts ut när listan ritas om. Släpp fokus först, annars
    // kan markeringen se ut att hoppa till kortet som tar dess plats.
    if (t.dataset.remove || t.dataset.watch || t.dataset.want || t.dataset.fav || t.dataset.more || t.dataset.progresstog || t.dataset.posterToggle) {
      t.blur();
    }

    if (t.dataset.tab) {
      state.tab = t.dataset.tab; state.returnTab = t.dataset.tab; state.page = 1;
      render();
      window.scrollTo({ top: 0, behavior: "smooth" });
      return;
    }

    if (t.id === "menuBtn") {
      var dd = document.getElementById("menuDropdown");
      var willOpen = !dd.classList.contains("open");
      dd.classList.toggle("open", willOpen);
      t.setAttribute("aria-expanded", willOpen);
      return;
    }

    if (t.dataset.page) {
      closeMenu();
      if (t.dataset.page === "compare") state.returnTab = "backup";
      if (t.dataset.page === "random") state.returnTab = "villse";
      state.tab = t.dataset.page;
      render();
      window.scrollTo({ top: 0, behavior: "smooth" });
      return;
    }

    if (t.id === "pageBack") {
      state.tab = state.returnTab || "film";
      render();
      window.scrollTo({ top: 0, behavior: "smooth" });
      return;
    }

    if (t.id === "randomAgainBtn") {
      var pool = state.wantToSee.map(function (k) { return BY_KEY[k]; }).filter(Boolean);
      var others = pool.filter(function (it) { return keyOf(it) !== state.randomPick; });
      var choices = others.length ? others : pool;
      if (choices.length) state.randomPick = keyOf(choices[Math.floor(Math.random() * choices.length)]);
      render();
      return;
    }

    if (t.dataset.more) {
      var mk = t.dataset.more;
      state.expanded[mk] = !state.expanded[mk];
      render();
      return;
    }

    if (t.dataset.progresstog) {
      var pk = t.dataset.progresstog;
      state.expandedProgress[pk] = !state.expandedProgress[pk];
      render();
      return;
    }

    if (t.dataset.listtog) {
      var lk = t.dataset.listtog;
      state.expandedLists[lk] = !state.expandedLists[lk];
      render();
      return;
    }

    if (t.dataset.posterToggle) {
      var pk = t.dataset.posterToggle;
      state.posterExpanded[pk] = !state.posterExpanded[pk];
      render();
      return;
    }

    if (t.classList.contains("theme-option")) {
      state.theme = t.dataset.themeChoice;
      document.documentElement.setAttribute("data-theme", state.theme);
      store.set(THEME_KEY, state.theme);
      markCurrentTheme();
      closeMenu();
      return;
    }

    if (t.dataset.svc) {
      var s = t.dataset.svc;
      var i = state.active.indexOf(s);
      if (i === -1) state.active.push(s); else state.active.splice(i, 1);
      state.page = 1;
      drawAll(); render(); return;
    }

    if (t.dataset.fav) {
      if (isReceivedProfile(state.activeProfile)) return;
      var k = t.dataset.fav;
      state.favorites = state.favorites.indexOf(k) !== -1
        ? state.favorites.filter(function (f) { return f !== k; })
        : [k].concat(state.favorites);
      store.set(FAV_KEY(), state.favorites);
      maybePushActiveProfileToCloud();
      render(); return;
    }

    if (t.dataset.watch) {
      if (isReceivedProfile(state.activeProfile)) return;
      var wk = t.dataset.watch;
      state.watched = state.watched.indexOf(wk) !== -1
        ? state.watched.filter(function (w) { return w !== wk; })
        : [wk].concat(state.watched);
      store.set(WATCHED_KEY(), state.watched);
      maybePushActiveProfileToCloud();
      drawAll(); render(); return;
    }

    if (t.dataset.want) {
      if (isReceivedProfile(state.activeProfile)) return;
      var vk = t.dataset.want;
      if (state.wantToSee.indexOf(vk) !== -1) {
        state.wantToSee = state.wantToSee.filter(function (w) { return w !== vk; });
        delete state.wantWho[vk];
        store.set(WANTWHO_KEY(), state.wantWho);
      } else {
        state.wantToSee = [vk].concat(state.wantToSee);
      }
      store.set(WANT_KEY(), state.wantToSee);
      maybePushActiveProfileToCloud();
      drawAll(); render(); return;
    }

    if (t.dataset.matchadd) {
      if (isReceivedProfile(state.activeProfile)) return;
      var mk = t.dataset.matchadd;
      if (state.wantToSee.indexOf(mk) === -1) {
        state.wantToSee = [mk].concat(state.wantToSee);
        store.set(WANT_KEY(), state.wantToSee);
        maybePushActiveProfileToCloud();
        drawAll();
      }
      render();
      return;
    }

    if (t.dataset.who !== undefined && t.hasAttribute("data-who")) {
      state.whoFilter = t.dataset.who;
      state.page = 1;
      render(); return;
    }

    if (t.dataset.kindfilter !== undefined && t.hasAttribute("data-kindfilter")) {
      state.kindFilter = t.dataset.kindfilter;
      state.page = 1;
      render(); return;
    }

    if (t.dataset.remove) {
      var rk = t.dataset.remove;
      if (state.removed.indexOf(rk) === -1) state.removed = [rk].concat(state.removed);
      state.favorites = state.favorites.filter(function (f) { return f !== rk; });
      state.watched = state.watched.filter(function (w) { return w !== rk; });
      state.wantToSee = state.wantToSee.filter(function (w) { return w !== rk; });
      delete state.wantWho[rk];
      store.set(REMOVED_KEY(), state.removed);
      store.set(FAV_KEY(), state.favorites);
      store.set(WATCHED_KEY(), state.watched);
      store.set(WANT_KEY(), state.wantToSee);
      store.set(WANTWHO_KEY(), state.wantWho);
      drawAll(); render(); return;
    }

    if (t.dataset.restore) {
      var rsk = t.dataset.restore;
      state.removed = state.removed.filter(function (x) { return x !== rsk; });
      store.set(REMOVED_KEY(), state.removed);
      drawAll(); render(); return;
    }

    if (t.id === "pagerPrev") { state.page--; render(); window.scrollTo({ top: 0, behavior: "smooth" }); return; }
    if (t.id === "pagerNext") { state.page++; render(); window.scrollTo({ top: 0, behavior: "smooth" }); return; }

    if (t.id === "exportBtn") { exportBackupFile(); return; }
    if (t.id === "renameProfileBtn") {
      var newName = prompt("Nytt namn på profilen \"" + state.activeProfile + "\":", state.activeProfile);
      if (newName !== null) renameActiveProfile(newName);
      return;
    }
    if (t.dataset.switchProfile) { switchProfile(t.dataset.switchProfile, true); return; }
    if (t.dataset.deleteProfile) { deleteProfile(t.dataset.deleteProfile); return; }
    if (t.id === "shareProfileBtn") { shareActiveProfile(); return; }

    if (t.id === "receiveShareBtn") {
      var parsed = parseShareInput(document.getElementById("receiveShareInput").value);
      if (!parsed.id) { alert("Det där ser inte ut som en delningslänk. Klistra in hela länken."); return; }
      var rname = parsed.name;
      if (!rname) {
        rname = prompt("Vad heter profilen du tar emot?", "");
        if (rname === null) return;
        rname = rname.trim();
        if (!rname) return;
      }
      receiveShare(parsed.id, rname, false);
      return;
    }

    if (t.id === "copyShareHintBtn" && state.shareHint) {
      var hurl = state.shareHint.url;
      if (navigator.clipboard) {
        navigator.clipboard.writeText(hurl).then(function () {
          alert("Länk kopierad. Öppna hemskärmsappen → Profiler & Backup → Ta emot delad profil och klistra in.");
        }).catch(function () { prompt("Kopiera länken:", hurl); });
      } else {
        prompt("Kopiera länken:", hurl);
      }
      return;
    }

    if (t.id === "closeShareHintBtn") { state.shareHint = null; render(); return; }

    if (t.id === "createListBtn") {
      var inputEl = document.getElementById("newListInput");
      if (createList(inputEl.value)) render();
      return;
    }

    if (t.dataset.viewlist) {
      state.viewingList = t.dataset.viewlist;
      state.returnTab = "lists";
      state.tab = "listview";
      render();
      window.scrollTo({ top: 0, behavior: "smooth" });
      return;
    }

    if (t.dataset.renamelist) {
      var newListName = prompt("Nytt namn på listan \"" + t.dataset.renamelist + "\":", t.dataset.renamelist);
      if (newListName !== null) renameList(t.dataset.renamelist, newListName);
      render();
      return;
    }

    if (t.dataset.deletelist) { deleteList(t.dataset.deletelist); render(); return; }
    if (t.id === "importBtn") { document.getElementById("importFile").click(); return; }
  });

  document.getElementById("homeBtn").addEventListener("click", function () {
    state.tab = "film"; state.returnTab = "film"; state.page = 1;
    render();
    window.scrollTo({ top: 0, behavior: "smooth" });
  });
  document.getElementById("homeBtn").addEventListener("keydown", function (e) {
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); this.click(); }
  });

  document.getElementById("searchBtn").addEventListener("click", function () {
    document.getElementById("searchInput").blur();
  });
  document.getElementById("searchInput").addEventListener("keydown", function (e) {
    if (e.key === "Enter") { e.target.blur(); }
  });
  document.getElementById("searchInput").addEventListener("input", function (e) {
    state.search = e.target.value;
    document.getElementById("searchClear").hidden = !state.search;
    state.page = 1;
    drawAll(); render();
  });
  document.getElementById("searchClear").addEventListener("click", function () {
    state.search = "";
    var input = document.getElementById("searchInput");
    input.value = "";
    this.hidden = true;
    state.page = 1;
    drawAll(); render();
    input.focus();
  });

  document.getElementById("genreSelect").addEventListener("change", function (e) {
    state.genre = e.target.value;
    state.page = 1;
    drawAll(); render();
  });

  document.getElementById("sortSelect").addEventListener("change", function (e) {
    state.sort = e.target.value;
    state.page = 1;
    drawAll(); render();
  });

  document.getElementById("runtimeSelect").addEventListener("change", function (e) {
    state.runtimeFilter = e.target.value;
    state.page = 1;
    drawAll(); render();
  });

  document.addEventListener("change", function (e) {
    var t = e.target;

    if (t.id === "importFile") {
      if (t.files.length) { importBackupFile(t.files[0]); t.value = ""; }
      return;
    }

    if (t.dataset.matchcheck !== undefined && t.hasAttribute("data-matchcheck")) {
      var mp = t.dataset.matchcheck;
      var idx = state.matchSelected.indexOf(mp);
      if (t.checked && idx === -1) {
        if (state.matchSelected.length < MATCH_MAX) state.matchSelected.push(mp);
      } else if (!t.checked && idx !== -1) {
        state.matchSelected.splice(idx, 1);
      }
      renderComparePage();
      return;
    }

    if (!t.classList) return;

    if (t.classList.contains("rate-sel")) {
      if (isReceivedProfile(state.activeProfile)) return;
      var k = t.dataset.rate;
      var v = t.value;
      if (v) state.ratings[k] = parseInt(v, 10);
      else delete state.ratings[k];
      store.set(RATING_KEY(), state.ratings);
      maybePushActiveProfileToCloud();
      render();
      return;
    }

    if (t.classList.contains("who-sel")) {
      if (isReceivedProfile(state.activeProfile)) return;
      var wk = t.dataset.whoset;
      if (t.value) state.wantWho[wk] = t.value;
      else delete state.wantWho[wk];
      store.set(WANTWHO_KEY(), state.wantWho);
      maybePushActiveProfileToCloud();
      render();
    }

    if (t.dataset.listcheck !== undefined && t.hasAttribute("data-listcheck")) {
      if (isReceivedProfile(state.activeProfile)) return;
      toggleListMembership(t.dataset.listcheck, t.dataset.listkey);
      render();
      return;
    }

    if (t.classList.contains("progress-sel")) {
      if (isReceivedProfile(state.activeProfile)) return;
      var pgk = t.dataset.progressset;
      var pgv = parseInt(t.value, 10) || 0;
      if (pgv > 0) state.seasonProgress[pgk] = pgv;
      else delete state.seasonProgress[pgk];
      store.set(PROGRESS_KEY(), state.seasonProgress);
      maybePushActiveProfileToCloud();
      render();
    }
  });

  function markCurrentTheme() {
    var opts = document.querySelectorAll(".theme-option");
    for (var i = 0; i < opts.length; i++) {
      opts[i].setAttribute("aria-current", opts[i].dataset.themeChoice === state.theme ? "true" : "false");
    }
  }

  document.getElementById("themeToggle").addEventListener("click", function () {
    var opts = document.getElementById("themeOptions");
    var willOpen = opts.hidden;
    opts.hidden = !willOpen;
    this.setAttribute("aria-expanded", willOpen);
  });

  markCurrentTheme();
  document.getElementById("sortSelect").value = state.sort;
  document.documentElement.setAttribute("data-theme", state.theme);

  // Fyller titelbanken med data hämtad från titles.json (uppdateras
  // automatiskt en gång i veckan av ett GitHub Actions-jobb).
  function populateFromData(data) {
    POOL.film = data.film || [];
    POOL.serie = data.serie || [];
    ALL_ITEMS = POOL.film.concat(POOL.serie);
    BY_KEY = {};
    ALL_ITEMS.forEach(function (it) { BY_KEY[keyOf(it)] = it; });
    GENRES = Array.from(new Set(ALL_ITEMS.map(function (it) { return genreBucket(it.genre); })))
      .sort(function (a, b) { return a.localeCompare(b, "sv"); });
  }

  document.getElementById("list").innerHTML =
    '<p class="load">Läser in titlar…</p>';

  fetch("titles.json?v=" + Date.now())
    .then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    })
    .then(function (data) {
      populateFromData(data);
      drawAll();
      render();
      resubscribeAllReceived();
      checkIncomingShare();
    })
    .catch(function (err) {
      document.getElementById("list").innerHTML =
        '<div class="empty"><p>Kunde inte läsa in titlarna</p><span>' +
        esc(String(err && err.message || err)) +
        ' — kontrollera att titles.json finns i samma mapp som index.html.</span></div>';
    });
})();
</script>

</body>
</html>
