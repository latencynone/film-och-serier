name: Uppdatera titlar

on:
  schedule:
    # Varje dag ca kl 06:00 svensk tid (cron kör i UTC, så tiden skiftar en
    # timme med sommartid). Daglig körning behövs för att den djupa
    # titelsökningen ska hinna ikapp inom OMDb:s gräns på 1000 anrop/dygn;
    # när allt är kollat blir varje körning snabb och billig.
    - cron: "0 4 * * *"
  workflow_dispatch: {}  # gör det möjligt att köra manuellt från Actions-fliken

permissions:
  contents: write

concurrency:
  group: update-titles
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checka ut repot
        uses: actions/checkout@v6

      - name: Sätt upp Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Kör uppdateringsskriptet
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
        run: python scripts/update_titles.py

      - name: Committa ändringar om det finns några
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add titles.json history.json scripts/seen_cache.json
          if git diff --cached --quiet; then
            echo "Inga ändringar."
          else
            git commit -m "Automatisk titeluppdatering $(date +%Y-%m-%d)"
            git push
          fi
